services:
  ollama:
    image: ollama/ollama:latest
    container_name: local-llm
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  ollama-model-puller:
    image: ollama/ollama:latest
    container_name: ollama-puller
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "echo 'Downloading model llama3.2:3b...' && ollama pull llama3.2:3b && echo 'Model ready.'"]
    restart: "no"

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: orchestrator-app
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=http://ollama:11434
      - LOCAL_MODEL_NAME=llama3.2:3b
    depends_on:
      ollama-model-puller:
        condition: service_completed_successfully

volumes:
  ollama_models:
    name: ollama_shared_models